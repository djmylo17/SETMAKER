name: Compilar SETMAKER (Windows portable)

# Cada push a main: pruebas + zip portable.
# Si la versión de app/__init__.py todavía no tiene Release, se publica sola (vX.Y.Z).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas automáticas
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          python -m pytest -q --tb=short -rf -p no:cacheprovider *> pytest.txt
          $code = $LASTEXITCODE
          Get-Content pytest.txt -Tail 60
          if ($code -ne 0) {
            $lines = Get-Content pytest.txt -Encoding utf8
            $hits = $lines | Where-Object { $_ -match "FAILED|ERROR|Error|assert|Exception" } | Select-Object -First 8
            if (-not $hits) { $hits = $lines | Select-Object -Last 8 }
            foreach ($l in $hits) { $m = ($l -replace "::", ": ").Substring(0, [Math]::Min(400, $l.Length)); Write-Output "::error::$m" }
          }
          exit $code

      - name: Empaquetar con PyInstaller
        run: pyinstaller setmaker.spec --noconfirm

      - name: Crear .zip portable
        shell: pwsh
        run: Compress-Archive -Path dist/SETMAKER -DestinationPath SETMAKER-windows.zip

      - name: Subir zip (descargable desde la pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SETMAKER-windows
          path: SETMAKER-windows.zip
          retention-days: 30

      - name: Leer versión y ver si ya está publicada
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import app; print(app.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La versión v$VERSION ya tiene Release; no se publica de nuevo."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SETMAKER v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: SETMAKER-windows.zip
          generate_release_notes: true
